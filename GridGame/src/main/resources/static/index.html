<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <title>GridGame | SpringBoot</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <div class="container">

        <div class="tela" id="tela-fundo">
            <div id="camera">
                <div id="game">
                    <div id="grid"></div>
                </div>
            </div>
        </div>

        <div class="container-criacao" id="container-criacao">

            <div class="part-1">
                <div class="label">
                    <p>Mapa padrão</p>
                    <input type="button" id="button-comecar" value="COMECE">
                </div>

                <div class="label">
                    <p>Crie seu proprio mapa</p>
                    <input type="button" id="button-criar-mapa" value="CRIAR">
                </div>
            </div>

            <div class="part-2">
                <div class="label">
                    <p>Escolha seu nome</p>
                    <input type="text" id="input-text-nome" placeholder="NOME:">
                </div>

                <div class="label">
                    <p>Escolha sua cor</p>
                    <input type="color" id="input-color" value="#e0e0e0">
                </div>
            </div>

            <div class="part-3">
                <div class="label mapas-label">
                    <div class="container-mapas-label">
                        <p>Selecione seu mapa</p>
                        <select id="select-mapas">
                            <option value="0">MAPA 0</option>
                        </select>
                    </div>

                    <div id="display-grid-mapa">    
                    </div>
                </div>
            </div>

        </div>
    </div>


    <script src="script/config.js"></script>
    <script type="module" src="./script/scripts.js"></script>
    <script type="module" src="./script/scriptsViews.js"></script>
    <script type="module">
        import { desenharJogadoresMultplayer } from './script/scripts.js';
        window.client = new StompJs.Client({
            webSocketFactory: () => new SockJS(`${window.urlPadrao}ws`),
            onConnect: () => {

                client.subscribe("/topic/player", (msg) => {
                    const jogador = JSON.parse(msg.body);

                    if (jogadorOn) desenharJogadoresMultplayer(jogador);
                });

            }
        });

        client.activate();

        function send() {
            if (!connected) {
                console.log("Ainda não conectou!");
                return;
            }
        }
    </script>
</body>

</html>
