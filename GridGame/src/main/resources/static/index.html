<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <title>GridGame | SpringBoot</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <div class="container">

        <div id="camera">
            <div id="game">
                <div id="grid"></div>
            </div>
        </div>

        <div class="container-criacao" id="container-criacao">

            <div class="label">
                <p>Mapa padrão</p>
                <input type="button" id="button-comecar" value="COMECE">
            </div>
 
            <div class="label">
                <p>Crie seu proprio mapa</p>
                <input type="button" id="button-criar-mapa" value="CRIAR">
            </div>

        </div>
    </div>


    <script src="./script/scripts.js"></script>
    <script src="./script/scriptsViews.js"></script>
    <script>

        window.client = new StompJs.Client({
            webSocketFactory: () => new SockJS('http://localhost:8080/ws'),
            onConnect: () => {
                window.jogadorOn = false;


                client.subscribe("/topic/player", (msg) => {
                    const jogador = JSON.parse(msg.body);

                    if (jogadorOn) desenharJogadoresMultplayer(jogador);
                });

            }
        });

        client.activate();

        function send() {
            if (!connected) {
                console.log("Ainda não conectou!");
                return;
            }
        }
    </script>
</body>

</html>
